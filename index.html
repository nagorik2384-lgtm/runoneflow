<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RunOneFlow</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #171717 0%, #050505 45%, #000 100%);
    color: white;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
}

/* Background glow */

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: rgba(255,255,255,0.035);
    filter: blur(100px);
    border-radius: 50%;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
}

/* Main */

.hero {
    min-height: 100vh;
    max-width: 1000px;
    margin: auto;
    padding: 70px 20px 50px;
    text-align: center;
    position: relative;
}

/* Logo */

.logo {
    width: 180px;
    max-width: 45vw;
    margin-bottom: 25px;

    opacity: 0;
    animation: logoAppear 1.2s ease forwards;

    filter:
        drop-shadow(0 0 15px rgba(255,255,255,0.15))
        drop-shadow(0 0 40px rgba(255,255,255,0.08));
}

@keyframes logoAppear {

    0% {
        opacity: 0;
        transform: scale(.7);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* Brand */

h1 {
    font-size: clamp(48px, 9vw, 92px);
    font-weight: 800;
    letter-spacing: -4px;
    line-height: 1;

    animation: titleAppear 1s ease .3s both;
}

@keyframes titleAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Subtitle */

.subtitle {
    margin: 25px auto 45px;
    max-width: 650px;

    font-size: clamp(18px, 3vw, 26px);
    line-height: 1.5;

    color: #aaa;

    animation: fadeUp 1s ease .6s both;
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Navigation */

.links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;

    max-width: 750px;
    margin: auto;
}

.card {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    min-height: 80px;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    color: white;
    text-decoration: none;

    font-size: 18px;
    font-weight: 500;

    backdrop-filter: blur(15px);

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease,
        background .35s ease;

    overflow: hidden;
}

.card::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform: translateX(-100%);
    transition: transform .7s ease;
}

.card:hover::before {
    transform: translateX(100%);
}

.card:hover {

    transform: translateY(-6px) scale(1.02);

    border-color: rgba(255,255,255,.55);

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        0 0 25px rgba(255,255,255,.08);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.04)
        );
}

.card:active {
    transform: scale(.97);
}

.icon {
    font-size: 22px;
}

/* Partner */

.partner {
    margin-top: 35px;

    border: 1px solid rgba(255,255,255,.45);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 0 30px rgba(255,255,255,.05);
}

.partner:hover {

    box-shadow:
        0 0 35px rgba(255,255,255,.15),
        0 15px 50px rgba(0,0,0,.6);
}

/* Donation */

.donate {
    margin-top: 18px;

    border-color: rgba(255,255,255,.25);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,.015)
        );
}

.donate:hover {
    border-color: rgba(255,255,255,.6);
}

/* Footer */

.footer {
    margin-top: 70px;

    color: #555;
    font-size: 13px;
}

/* Mobile */

@media (max-width: 650px) {

    .hero {
        padding-top: 50px;
    }

    .logo {
        width: 150px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .links {
        grid-template-columns: 1fr;
    }

    .card {
        min-height: 72px;
        font-size: 17px;
    }
}

/* Entry animation */

.card {
    opacity: 0;
    animation: cardAppear .8s ease forwards;
}

.card:nth-child(1) {
    animation-delay: .8s;
}

.card:nth-child(2) {
    animation-delay: .95s;
}

.card:nth-child(3) {
    animation-delay: 1.1s;
}

.card:nth-child(4) {
    animation-delay: 1.25s;
}

.card:nth-child(5) {
    animation-delay: 1.4s;
}

.card:nth-child(6) {
    animation-delay: 1.55s;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>

</head>


<body>

<main class="hero">

    <!-- LOGO -->
    <img
        src="logo.PNG"
        alt="RunOneFlow"
        class="logo"
    >

    <!-- BRAND -->
    <h1>RunOneFlow</h1>

    <p class="subtitle">
        One place for everything a runner needs.
    </p>


    <!-- LINKS -->

    <div class="links">

        <a
            href="https://nearbyrun.com"
            target="_blank"
            class="card"
        >
            <span class="icon">
                <i class="fa-solid fa-location-dot"></i>
            </span>

            <span>NearbyRun</span>
        </a>


        <a
            href="https://t.me/+1BHULZ9deIdlNTY6"
            target="_blank"
            class="card"
        >
            <span class="icon">
                <i class="fa-brands fa-telegram"></i>
            </span>

            <span>Telegram</span>
        </a>


        <a
            href="#"
            class="card"
        >
            <span class="icon">
                <i class="fa-brands fa-instagram"></i>
            </span>

            <span>Instagram</span>
        </a>


        <a
            href="#"
            class="card partner"
        >
            <span class="icon">
                <i class="fa-solid fa-handshake"></i>
            </span>

            <span>Become a Partner</span>
        </a>

    </div>


    <!-- SUPPORT -->

    <a
        href="https://send.monobank.ua/jar/A413TS2pY2"
        target="_blank"
        class="card donate"
        style="max-width:750px; margin-left:auto; margin-right:auto;"
    >

        <span class="icon">
            <i class="fa-solid fa-heart"></i>
        </span>

        <span>Support the Project</span>

    </a>


    <div class="footer">

        © 2026 RunOneFlow

    </div>

</main>

</body>

</html>
